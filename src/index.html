<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self';">
  <title>Niobium Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../assets/icon.svg" alt="" class="brand-icon"><span>niobium</span></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Browser tabs"></div>
    <button class="new-tab" id="newTab" title="New tab" aria-label="New tab">+</button>
    <div class="window-mark">●</div>
  </header>

  <nav class="toolbar" aria-label="Navigation">
    <button id="back" class="tool" title="Back" aria-label="Back">‹</button>
    <button id="forward" class="tool" title="Forward" aria-label="Forward">›</button>
    <button id="reload" class="tool" title="Reload" aria-label="Reload">↻</button>
    <button id="home" class="tool" title="Home" aria-label="Home">⌂</button>
    <form id="addressForm" class="address-wrap">
      <span class="secure-mark">◈</span>
      <input id="address" autocomplete="off" spellcheck="false" aria-label="Address or search" placeholder="Search or enter address">
      <button type="submit" class="go" aria-label="Go">↵</button>
    </form>
    <button id="menu" class="tool menu" title="About Niobium" aria-label="About Niobium">⋯</button>
  </nav>

  <main id="viewport" class="viewport"></main>
  <footer class="status"><span class="status-dot"></span><span id="statusText">Ready to explore</span><span class="version">NIOBIUM · 0.1.0</span></footer>
  <script src="renderer.js"></script>
</body>
</html>
