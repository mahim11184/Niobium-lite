name: Niobium hosted Chromium build stage
description: Resume one hosted Chromium compilation stage with Niobium branding
inputs:
  architecture:
    required: true
  chromium_source:
    required: true
  source_run_id:
    required: false
    default: ''
  threads:
    required: false
    default: '0'
  keystore_b64:
    required: false
  keystore_pass:
    required: false
outputs:
  status:
    value: ${{ steps.build.outputs.status }}
runs:
  using: composite
  steps:
    - name: Prepare runner
      shell: bash
      env:
        UGC_WORK: /mnt/ugc
      run: .github/scripts/hosted-prepare.sh
    - name: Restore build tree
      shell: bash
      env:
        UGC_WORK: /mnt/ugc
        ARCH: ${{ inputs.architecture }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/hosted-import.sh
    - name: Reapply Niobium identity to restored source
      shell: bash
      run: bash niobium/scripts/rebrand-ungoogled.sh /mnt/ugc/src /mnt/ugc niobium
    - name: Continue Chromium build
      id: build
      shell: bash
      env:
        UGC_WORK: /mnt/ugc
        NINJA_TIMEOUT: '16200s'
        NINJA_JOBS: ${{ inputs.threads }}
        DEBIAN_FRONTEND: noninteractive
        CHROMIUM_SOURCE: ${{ inputs.chromium_source == 'github' && 'https://github.com/chromium/chromium.git' || 'https://chromium.googlesource.com/chromium/src.git' }}
      run: >
        .github/scripts/hosted-build.sh --install-deps --resume
        --arch "${{ inputs.architecture }}"
        --target chrome_modern_target
    - name: Pack build tree for next stage
      if: steps.build.outputs.status == 'running'
      shell: bash
      env:
        UGC_WORK: /mnt/ugc
      run: .github/scripts/hosted-export.sh
    - name: Save build tree
      if: steps.build.outputs.status == 'running'
      uses: actions/upload-artifact@v4
      with:
        name: build-tree-${{ inputs.architecture }}
        path: build-tree.tar.zst
        retention-days: 1
        overwrite: true
        compression-level: 0
    - name: Upload completed Niobium APK
      if: steps.build.outputs.status == 'completed'
      shell: bash
      run: |
        cd /mnt/ugc
        mkdir -p /mnt/ugc/niobium-dist
        find src/out/Default/apks -maxdepth 1 -name 'ChromePublic.apk' -exec cp {} /mnt/ugc/niobium-dist/Niobium-Full-${{ inputs.architecture }}.apk \;
        test -s /mnt/ugc/niobium-dist/Niobium-Full-${{ inputs.architecture }}.apk
        printf 'Product: Niobium Full\nBase: ungoogled-chromium-android\nPackage: app.niobium.browser.full\nArchitecture: ${{ inputs.architecture }}\nBuild: upstream release configuration; signing status must be verified before distribution\n' > /mnt/ugc/niobium-dist/BUILD-INFO.txt
      # Artifacts must be uploaded by a separate step; this action runs in the
      # caller's workspace, so copy the output there first.
    - name: Copy APK to workflow workspace
      if: steps.build.outputs.status == 'completed'
      shell: bash
      run: |
        mkdir -p niobium-dist
        cp /mnt/ugc/niobium-dist/* niobium-dist/
    - name: Publish Niobium APK artifact
      if: steps.build.outputs.status == 'completed'
      uses: actions/upload-artifact@v4
      with:
        name: Niobium-Full-Android-${{ inputs.architecture }}
        path: niobium-dist/*
        retention-days: 30
