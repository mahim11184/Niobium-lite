name: Fetch Cromite Upstream Android APKs (Reference Only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chromium-base.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  upstream-reference-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Find latest official Cromite Android release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.github.com/repos/uazo/cromite/releases/latest -o release.json
          TAG="$(jq -r .tag_name release.json)"
          test -n "$TAG" && test "$TAG" != "null"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          jq -r '.assets[] | select(.name == "arm64_ChromePublic.apk" or .name == "arm_ChromePublic.apk") | [.name, .browser_download_url] | @tsv' release.json > assets.tsv
          test "$(wc -l < assets.tsv)" -eq 2
      - name: Download official unmodified Cromite APKs
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name url; do
            curl -fL --retry 3 "$url" -o "dist/$name"
          done < assets.tsv
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          printf '%s\n' \
            'These are official, unmodified Cromite APKs for upstream reference/testing.' \
            'They are NOT Niobium-branded builds. Renaming these files does not rebrand the installed app.' \
            'Source: https://github.com/uazo/cromite' > README-UPSTREAM-ONLY.txt
      - name: Upload upstream reference APKs (not Niobium builds)
        uses: actions/upload-artifact@v4
        with:
          name: Cromite-Upstream-Reference-Android-APKs-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
