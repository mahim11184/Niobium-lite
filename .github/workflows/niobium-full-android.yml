name: Build Niobium Full Android (ungoogled Chromium)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Android CPU architecture
        required: true
        type: choice
        default: arm64
        options: [arm64, arm]
      chromium_source:
        description: Chromium source mirror
        required: true
        type: choice
        default: github
        options: [github, googlesource]
      threads:
        description: Ninja threads (0 uses runner default)
        required: false
        default: '2'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: niobium-full-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout upstream build system
        uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-android
          ref: master
          path: .
      - name: Checkout Niobium branding
        uses: actions/checkout@v4
        with:
          repository: mahim11184/Niobium
          ref: main
          path: niobium
      - name: Prepare hosted runner
        shell: bash
        env:
          UGC_WORK: /mnt/ugc
        run: .github/scripts/hosted-prepare.sh
      - name: Fetch and configure Chromium source
        shell: bash
        env:
          UGC_WORK: /mnt/ugc
          DEBIAN_FRONTEND: noninteractive
          CHROMIUM_SOURCE: ${{ inputs.chromium_source == 'github' && 'https://github.com/chromium/chromium.git' || 'https://chromium.googlesource.com/chromium/src.git' }}
          NINJA_JOBS: ${{ inputs.threads }}
        run: >
          .github/scripts/hosted-build.sh --install-deps --prepare-only
          --arch "${{ inputs.architecture }}"
          --target chrome_modern_target
      - name: Apply Niobium name, package ID and artwork
        shell: bash
        run: bash niobium/scripts/rebrand-ungoogled.sh /mnt/ugc/src /mnt/ugc niobium
      - name: Save prepared Chromium tree
        shell: bash
        env:
          UGC_WORK: /mnt/ugc
        run: .github/scripts/hosted-export.sh
      - name: Upload prepared tree
        uses: actions/upload-artifact@v4
        with:
          name: build-tree-${{ inputs.architecture }}
          path: build-tree.tar.zst
          retention-days: 1
          compression-level: 0

  part-01:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-android
          ref: master
          path: .
      - uses: actions/checkout@v4
        with:
          repository: mahim11184/Niobium
          ref: main
          path: niobium
      - id: stage
        uses: ./niobium/.github/actions/niobium-build-stage
        with:
          architecture: ${{ inputs.architecture }}
          chromium_source: ${{ inputs.chromium_source }}
          threads: ${{ inputs.threads }}

  part-02:
    needs: part-01
    if: needs.part-01.outputs.status == 'running'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-android
          ref: master
          path: .
      - uses: actions/checkout@v4
        with:
          repository: mahim11184/Niobium
          ref: main
          path: niobium
      - id: stage
        uses: ./niobium/.github/actions/niobium-build-stage
        with:
          architecture: ${{ inputs.architecture }}
          chromium_source: ${{ inputs.chromium_source }}
          threads: ${{ inputs.threads }}

  part-03:
    needs: part-02
    if: needs.part-02.outputs.status == 'running'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-android
          ref: master
          path: .
      - uses: actions/checkout@v4
        with:
          repository: mahim11184/Niobium
          ref: main
          path: niobium
      - id: stage
        uses: ./niobium/.github/actions/niobium-build-stage
        with:
          architecture: ${{ inputs.architecture }}
          chromium_source: ${{ inputs.chromium_source }}
          threads: ${{ inputs.threads }}

  part-04:
    needs: part-03
    if: needs.part-03.outputs.status == 'running'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-android
          ref: master
          path: .
      - uses: actions/checkout@v4
        with:
          repository: mahim11184/Niobium
          ref: main
          path: niobium
      - id: stage
        uses: ./niobium/.github/actions/niobium-build-stage
        with:
          architecture: ${{ inputs.architecture }}
          chromium_source: ${{ inputs.chromium_source }}
          threads: ${{ inputs.threads }}

  part-05:
    needs: part-04
    if: needs.part-04.outputs.status == 'running'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-android
          ref: master
          path: .
      - uses: actions/checkout@v4
        with:
          repository: mahim11184/Niobium
          ref: main
          path: niobium
      - id: stage
        uses: ./niobium/.github/actions/niobium-build-stage
        with:
          architecture: ${{ inputs.architecture }}
          chromium_source: ${{ inputs.chromium_source }}
          threads: ${{ inputs.threads }}

  part-06:
    needs: part-05
    if: needs.part-05.outputs.status == 'running'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-android
          ref: master
          path: .
      - uses: actions/checkout@v4
        with:
          repository: mahim11184/Niobium
          ref: main
          path: niobium
      - id: stage
        uses: ./niobium/.github/actions/niobium-build-stage
        with:
          architecture: ${{ inputs.architecture }}
          chromium_source: ${{ inputs.chromium_source }}
          threads: ${{ inputs.threads }}

  part-07:
    needs: part-06
    if: needs.part-06.outputs.status == 'running'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      status: ${{ steps.stage.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-android
          ref: master
          path: .
      - uses: actions/checkout@v4
        with:
          repository: mahim11184/Niobium
          ref: main
          path: niobium
      - id: stage
        uses: ./niobium/.github/actions/niobium-build-stage
        with:
          architecture: ${{ inputs.architecture }}
          chromium_source: ${{ inputs.chromium_source }}
          threads: ${{ inputs.threads }}

  part-08:
    needs: part-07
    if: needs.part-07.outputs.status == 'running'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ungoogled-software/ungoogled-chromium-android
          ref: master
          path: .
      - uses: actions/checkout@v4
        with:
          repository: mahim11184/Niobium
          ref: main
          path: niobium
      - id: stage
        uses: ./niobium/.github/actions/niobium-build-stage
        with:
          architecture: ${{ inputs.architecture }}
          chromium_source: ${{ inputs.chromium_source }}
          threads: ${{ inputs.threads }}
